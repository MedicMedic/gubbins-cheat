        // Count words in candidates that have blockText starting at each position,
        // requiring all otherBlockTexts to appear somewhere in the word too.
        // A position overlapping a filled letter box is NOT walled off: the block may be placed across
        // it as long as it's consistent. Since `candidates` already match the filled pattern, a count
        // at such a position can only come from words whose letters there equal the filled letters —
        // i.e. the already-placed letters are considered, not treated as barriers.
        function analyzeBlockPositionsFiltered(blockText, otherBlockTexts, candidates, filledPrefix) {
            const bl = blockText.length;
            if (bl === 0 || bl > wordLength) return [];
            const numPositions = wordLength - bl + 1;
            const counts = new Array(numPositions).fill(0);
            for (const word of candidates) {
                if (otherBlockTexts.some(t => !word.includes(t))) continue;
                for (let i = 0; i < numPositions; i++) {
                    if (word.startsWith(blockText, i)) counts[i]++;
                }
            }
            return counts;
        }

        function getSubsets(arr, size) {
            if (size > arr.length) return [];
            if (size === arr.length) return [arr.slice()];
            if (size === 1) return arr.map(x => [x]);
            const result = [];
            for (let i = 0; i <= arr.length - size; i++) {
                for (const rest of getSubsets(arr.slice(i + 1), size - 1)) result.push([arr[i], ...rest]);
            }
            return result;
        }

        // Find top non-overlapping position combos for ALL blocks in the given array.
        // Each result: { positions (1-indexed), count, blocks }
        function computeJointPlacementsN(blocks, candidates, filledPrefix) {
            const comboCounts = new Map();
            const bls = blocks.map(b => b.text.length);
            const usedS = new Array(blocks.length);
            const usedE = new Array(blocks.length);
            const combo = new Array(blocks.length);

            for (const word of candidates) {
                if (blocks.some(b => !word.includes(b.text))) continue; // fast pre-filter
                const validPos = blocks.map((block, bi) => {
                    const bl = bls[bi], pos = [];
                    for (let i = 0; i <= word.length - bl; i++) {
                        if (!hasFilledInRange(filledPrefix, i, bl) && word.startsWith(block.text, i)) pos.push(i);
                    }
                    return pos;
                });
                if (validPos.some(p => p.length === 0)) continue;

                const wordSeenKeys = new Set();
                function bt(idx, uc) {
                    if (idx === blocks.length) {
                        // Normalize: sort (position, text) pairs so same-text blocks at swapped positions deduplicate
                        const pairs = combo.map((pos, i) => [pos, blocks[i].text, i])
                            .sort((a, b) => a[0] - b[0] || a[1].localeCompare(b[1]));
                        const key = pairs.map(([p, t]) => `${p}:${t}`).join('|');
                        if (wordSeenKeys.has(key)) return;
                        wordSeenKeys.add(key);
                        if (!comboCounts.has(key)) {
                            comboCounts.set(key, { count: 0, sortedIndices: pairs.map(([,, i]) => i) });
                        }
                        comboCounts.get(key).count++;
                        return;
                    }
                    const bl = bls[idx];
                    outer: for (const pos of validPos[idx]) {
                        const end = pos + bl - 1;
                        for (let j = 0; j < uc; j++) { if (!(end < usedS[j] || pos > usedE[j])) continue outer; }
                        usedS[uc] = pos; usedE[uc] = end; combo[idx] = pos;
                        bt(idx + 1, uc + 1);
                    }
                }
                bt(0, 0);
            }
            return [...comboCounts.entries()]
                .sort((a, b) => b[1].count - a[1].count).slice(0, 5)
                .map(([k, { count, sortedIndices }]) => ({
                    positions: k.split('|').map(part => parseInt(part) + 1),
                    count,
                    blocks: sortedIndices.map(i => blocks[i])
                }));
        }

        function renderBlockChip(block) {
            return `<span style="background-color:${block.color};padding:1px 6px;border:1px solid rgba(0,0,0,0.25);font-family:'Banana Grotesk',sans-serif;">${block.text.toUpperCase()}</span>`;
        }

        // One "best position" bar chart. `clickFn`/`clickArg` build the per-bar onclick:
        // `clickFn(clickArg, i)`. Returns '' (renders nothing) when no position is placeable.
        function renderPosBars(chipHtml, counts, total, color, clickFn, clickArg) {
            const max = counts.length ? Math.max(...counts) : 0;
            if (max <= 0) return '';
            const bestPos = counts.findIndex(c => c === max) + 1;
            let html = `<div style="margin-bottom:14px;">
                <div style="font-family:'Banana Grotesk',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.08em;margin-bottom:6px;">
                    ${chipHtml} &mdash; best at position ${bestPos}
                    <span style="font-weight:400;color:#555;">(${max.toLocaleString()} / ${total.toLocaleString()} words)</span>
                </div>
                <div style="display:flex;gap:3px;align-items:flex-end;">`;
            for (let i = 0; i < counts.length; i++) {
                const ratio = max > 0 ? counts[i] / max : 0;
                const barH = Math.round(10 + ratio * 52);
                const opacity = (0.18 + ratio * 0.82).toFixed(2);
                const isBest = counts[i] === max;
                const border = isBest ? '2px solid #000' : '1px solid rgba(0,0,0,0.18)';
                html += `<div onclick="${clickFn}('${clickArg}', ${i})" style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:30px;cursor:pointer;" onmouseover="this.style.background='rgba(0,0,0,0.06)'" onmouseout="this.style.background=''">
                    <div style="font-family:'Banana Grotesk',sans-serif;font-size:0.58rem;color:#444;line-height:1;">${counts[i].toLocaleString()}</div>
                    <div style="width:28px;height:${barH}px;background-color:${color};opacity:${opacity};border:${border};flex-shrink:0;"></div>
                    <div style="font-family:'Banana Grotesk',sans-serif;font-size:0.65rem;font-weight:${isBest ? '700' : '400'};line-height:1;">${i + 1}</div>
                </div>`;
            }
            html += `</div></div>`;
            return html;
        }

        let posAnalysisExpanded = true;

        function togglePositionAnalysis() {
            posAnalysisExpanded = !posAnalysisExpanded;
            const resultsEl = document.getElementById('posAnalysisResults');
            const btn = document.getElementById('posAnalysisToggle');
            if (resultsEl) resultsEl.style.display = posAnalysisExpanded ? '' : 'none';
            if (btn) btn.textContent = posAnalysisExpanded ? '−' : '+';
        }

        function runPositionAnalysis() {
            const section = document.getElementById('posAnalysisSection');
            const resultsEl = document.getElementById('posAnalysisResults');
            if (!section || !resultsEl) return;

            if (requiredBlocks.length === 0) { section.style.display = 'none'; return; }

            // Filter candidates by current letter-box pattern
            const raw = wordBuckets[wordLength] || [];
            const withoutRemoved = removedWords.size > 0 ? raw.filter(w => !removedWords.has(w)) : raw;
            const candidates = letterBoxes.some(b => b !== '')
                ? withoutRemoved.filter(w => matchesPattern(w, letterBoxes))
                : withoutRemoved;

            if (candidates.length === 0) { section.style.display = 'none'; return; }
            const total = candidates.length;
            const filledPrefix = buildFilledPrefix(letterBoxes);

            let html = '';
            bestPositionCombo = null;
            _positionCombos = [];

            // Joint section: collect all combos from all subset sizes, group by total letters filled
            if (requiredBlocks.length >= 2) {
                const n = requiredBlocks.length;
                const allCombos = [];
                const seenComboSigs = new Set();
                for (let k = n; k >= 2; k--) {
                    for (const subset of getSubsets(requiredBlocks, k)) {
                        for (const combo of computeJointPlacementsN(subset, candidates, filledPrefix)) {
                            const sig = combo.positions.map((p, i) => `${p}:${combo.blocks[i].text}`).join('|');
                            if (!seenComboSigs.has(sig)) { seenComboSigs.add(sig); allCombos.push(combo); }
                        }
                    }
                }
                if (allCombos.length > 0) {
                    // Group by total letters covered
                    const groups = new Map();
                    for (const combo of allCombos) {
                        const letters = combo.blocks.reduce((s, b) => s + b.text.length, 0);
                        if (!groups.has(letters)) groups.set(letters, []);
                        groups.get(letters).push(combo);
                    }
                    // Sort groups most-letters first; within each group sort by word count
                    const sortedGroups = [...groups.entries()].sort((a, b) => b[0] - a[0]);
                    sortedGroups.forEach(([, combos]) => combos.sort((a, b) => b.count - a.count));

                    // Best combo = top of the highest-letter group
                    const topCombo = sortedGroups[0][1][0];
                    bestPositionCombo = topCombo.positions.map((pos, pi) => ({
                        blockIndex: requiredBlocks.indexOf(topCombo.blocks[pi]),
                        start: pos - 1
                    }));

                    const topLetters = sortedGroups[0][0];
                    sortedGroups.forEach(([letters, combos]) => {
                        const isTop = letters === topLetters;
                        html += `<div style="margin-bottom:16px;">
                            <div style="font-family:'Banana Grotesk',sans-serif;font-size:0.75rem;font-weight:700;letter-spacing:0.06em;margin-bottom:5px;color:${isTop ? '#000' : '#666'};">
                                ${letters} letters
                            </div>
                            <div style="display:flex;flex-direction:column;gap:4px;">`;
                        combos.forEach((combo, i) => {
                            const prevPlacements = combo.positions.map((pos, pi) => ({
                                start: pos - 1, length: combo.blocks[pi].text.length,
                                color: combo.blocks[pi].color, text: combo.blocks[pi].text
                            }));
                            const comboIdx = _positionCombos.length;
                            _positionCombos.push(prevPlacements.map((p, pi) => ({ start: p.start, text: p.text, blockId: combo.blocks[pi].id })));
                            const chips = combo.blocks.map(b => renderBlockChip(b)).join(' ');
                            html += `<div onclick="applyPositionCombo(${comboIdx})" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:'Banana Grotesk',sans-serif;font-size:0.73rem;cursor:pointer;padding:3px 4px;transition:background 100ms;${i === 0 && isTop ? 'font-weight:700;' : 'color:#555;'}" onmouseover="this.style.background='rgba(0,0,0,0.04)'" onmouseout="this.style.background=''">
                                ${chips} ${renderPositionPreview(wordLength, prevPlacements)}
                                <span style="color:#888;font-weight:400;">${combo.count.toLocaleString()} words</span>
                            </div>`;
                        });
                        html += `</div></div>`;
                    });
                }
            }

            // Per-block bar charts — independent, no cross-block requirement.
            for (const block of requiredBlocks) {
                // Whole-block placement (uses the tile in one piece). A block can't be dropped onto
                // a box that's already filled, so exclude any start whose span overlaps a filled box.
                const counts = analyzeBlockPositionsFiltered(block.text, [], candidates, filledPrefix);
                for (let p = 0; p < counts.length; p++) {
                    if (hasFilledInRange(filledPrefix, p, block.text.length)) counts[p] = 0;
                }
                html += renderPosBars(renderBlockChip(block), counts, total, block.color, 'applyBarPosition', block.id);
                // Single-letter placement for each distinct letter — where to put just that letter when
                // the tile is used partially (e.g. the S of LS).
                if (block.text.length >= 2) {
                    const seen = new Set();
                    for (const ch of block.text) {
                        if (seen.has(ch)) continue;
                        seen.add(ch);
                        const letterCounts = analyzeBlockPositionsFiltered(ch, [], candidates, filledPrefix);
                        // A single borrowed letter can only go into an EMPTY box; an already-filled
                        // box scores `total` here (every candidate matches the pattern) and would
                        // otherwise dominate as the "best" position. Exclude filled boxes.
                        for (let p = 0; p < letterCounts.length; p++) {
                            if (letterBoxes[p] && letterBoxes[p] !== '') letterCounts[p] = 0;
                        }
                        const chip = `<span style="background-color:${block.color};padding:1px 6px;border:1px solid rgba(0,0,0,0.25);font-family:'Banana Grotesk',sans-serif;">${ch.toUpperCase()}</span><span style="font-weight:400;color:#888;font-size:0.7rem;"> of ${block.text.toUpperCase()}</span>`;
                        html += renderPosBars(chip, letterCounts, total, block.color, 'applyLetterAt', ch);
                    }
                }
            }

            if (!html) { section.style.display = 'none'; return; } // nothing placeable to analyze
            resultsEl.innerHTML = html;
            section.style.display = '';
            resultsEl.style.display = posAnalysisExpanded ? '' : 'none';
        }

        const schedulePositionAnalysis = debounce(runPositionAnalysis, 80);

        document.getElementById('wordLength').addEventListener('change', (e) => {
            wordLength = parseInt(e.target.value);
            initializeBoxes();
            scheduleUpdateResults();
            updateClearButton();
            schedulePositionAnalysis();
        });
        document.getElementById('addBlock').addEventListener('click', addBlock);
        document.getElementById('blockInput').addEventListener('keydown', (e) => {
            if (['Backspace','Delete','ArrowLeft','ArrowRight','Home','End','Tab'].includes(e.key)) return;
            if (/^[a-zA-Z]$/.test(e.key)) return;
            if (e.key === 'Unidentified') return; // mobile: handled by input event
            e.preventDefault();
            addBlock();
        });
        document.getElementById('blockInput').addEventListener('input', (e) => {
            const raw = e.target.value;
            const clean = raw.replace(/[^a-zA-Z]/g, '');
            e.target.value = clean;
            if (clean !== raw && clean.length > 0) addBlock(); // non-letter typed on mobile → submit
        });
        document.getElementById('clearAll').addEventListener('click', clearAllBoxes);
        document.getElementById('clearBlocksAll')?.addEventListener('click', () => { saveUndoState(); requiredBlocks = []; updateBlocksList(); scheduleUpdateResults(); schedulePositionAnalysis(); });
        document.getElementById('filterByBlocks')?.addEventListener('change', (e) => { filterByBlocks = !!e.target.checked; scheduleUpdateResults(); });
        document.getElementById('softFilterMode')?.addEventListener('change', (e) => { softFilterMode = !!e.target.checked; scheduleUpdateResults(); });
        document.getElementById('clearSavedAll')?.addEventListener('click', () => { savedWords = []; persistSavedWords(); updateSavedWordsPanel(); scheduleUpdateResults(); });

        function moveActiveTo(index) {
            if (index == null) { activeBox = null; }
            else { activeBox = Math.max(0, Math.min(letterBoxes.length - 1, index)); }
            updateBoxStyles(); updateKeyboard();
        }
        function moveActive(delta) {
            if (activeBox === null) { moveActiveTo(delta > 0 ? 0 : letterBoxes.length - 1); return; }
            moveActiveTo(activeBox + delta);
        }

        document.addEventListener('keydown', (e) => {
            const ae = document.activeElement;
            if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
            if (e.key && e.key.length === 1 && /^[a-zA-Z]$/.test(e.key)) {
                e.preventDefault();
                if (activeBox === null) { const ne = letterBoxes.findIndex(b => b === ''); moveActiveTo(ne !== -1 ? ne : 0); }
                handleLetterInput(e.key.toUpperCase()); return;
            }
            if (e.key === 'Backspace') {
                e.preventDefault();
                if (activeBox !== null) { clearBox(activeBox); }
                else { for (let i = letterBoxes.length - 1; i >= 0; i--) { if (letterBoxes[i]) { moveActiveTo(i); break; } } }
                return;
            }
            if (e.key === 'Delete')     { e.preventDefault(); if (activeBox !== null) clearBox(activeBox); return; }
            if (e.key === 'ArrowRight') { e.preventDefault(); moveActive(1);  return; }
            if (e.key === 'ArrowLeft')  { e.preventDefault(); moveActive(-1); return; }
            if (e.key === 'Enter') {
                e.preventDefault();
                if (activeBox !== null) { const ne = letterBoxes.findIndex((b, i) => i > activeBox && b === ''); moveActiveTo(ne !== -1 ? ne : null); }
                return;
            }
            if (e.key === 'Escape') { e.preventDefault(); moveActiveTo(null); return; }
        });

        initializeBoxes();
        loadRemovedWords();
        loadSavedWords();

        // Create a small hidden input that receives focus on mobile to open the soft keyboard
        function createHiddenInput() {
            if (document.getElementById('hiddenInput')) return;
            const inp = document.createElement('input');
            inp.id = 'hiddenInput';
            inp.type = 'text';
            inp.autocorrect = 'off';
            inp.autocomplete = 'off';
            inp.autocapitalize = 'characters';
            inp.spellcheck = false;
            inp.inputMode = 'text';
            // place it on-screen but invisible so mobile keyboards will open
            inp.style.position = 'fixed';
            inp.style.left = '8px';
            inp.style.bottom = '8px';
            inp.style.width = '40px';
            inp.style.height = '36px';
            inp.style.opacity = '0';
            inp.style.zIndex = '9999';
            inp.style.background = 'transparent';
            inp.style.border = 'none';
            document.body.appendChild(inp);

            // When user types on mobile, the input event fires with the typed characters
            inp.addEventListener('input', (e) => {
                const v = e.target.value || '';
                if (!v) return;
                // insert all characters (handle multi-letter paste), keep only last char as typed
                for (let i = 0; i < v.length; i++) {
                    const ch = v[i];
                    if (/^[a-zA-Z]$/.test(ch)) handleLetterInput(ch.toUpperCase());
                }
                e.target.value = '';
            });

            // Handle navigation and deletion keys while the hidden input has focus
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    e.preventDefault();
                    if (activeBox !== null) { clearBox(activeBox); }
                    else { for (let i = letterBoxes.length - 1; i >= 0; i--) { if (letterBoxes[i]) { moveActiveTo(i); break; } } }
                    return;
                }
                if (e.key === 'Delete') { e.preventDefault(); if (activeBox !== null) clearBox(activeBox); return; }
                if (e.key === 'ArrowRight') { e.preventDefault(); moveActive(1); return; }
                if (e.key === 'ArrowLeft') { e.preventDefault(); moveActive(-1); return; }
                if (e.key === 'Enter') { e.preventDefault(); if (activeBox !== null) { const ne = letterBoxes.findIndex((b, i) => i > activeBox && b === ''); moveActiveTo(ne !== -1 ? ne : null); } return; }
                if (e.key === 'Escape') { e.preventDefault(); moveActiveTo(null); return; }
            });
        }
        createHiddenInput();

        // Load from IndexedDB cache first; fall back to wordlist.js on cache miss.
        initWordData();

        // Lazy-load background images after idle or on load
        (function lazyLoadBackgrounds(){
            function applyImages(){
                try {
                    document.body.style.backgroundImage = "url('BG.jpg')";
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundRepeat = 'no-repeat';
                    const inner = document.querySelector('.inner-card');
                    if (inner) {
                        inner.style.backgroundImage = "url('InnerBG.jpg')";
                        inner.style.backgroundSize = 'cover';
                        inner.style.backgroundPosition = 'center';
                        inner.style.backgroundRepeat = 'no-repeat';
                    }
                } catch(e){ /* ignore */ }
            }
            if ('requestIdleCallback' in window) requestIdleCallback(applyImages, {timeout:2000});
            else window.addEventListener('load', applyImages);
        })();
    </script>
</body>
