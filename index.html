<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill-in-the-Blanks Word Finder</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <!-- Preconnect to font hosts to speed font loading -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/banana-grotesk" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
    <style>
        /* Use Coming Soon for most UI text; exclude letter boxes and results. Defer large background images for performance */
        body { font-family: 'Coming Soon', cursive; background-color: transparent !important; text-transform: uppercase !important; }
        /* Letter boxes: fluid grid — all boxes in one row */
        #letterBoxes {
            display: grid;
            gap: 0;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }
        .letter-box {
            width: 100%;
            aspect-ratio: 1;
            font-family: 'Banana Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            border: 2px solid #000000;
            border-radius: 0;
            background-color: #e6e2d6;
            cursor: pointer;
            transition: all 0.12s;
            font-size: clamp(0.45rem, 2.2vw, 2rem);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .letter-box:hover  { border-color: #000000; transform: scale(1.01); }
        .letter-box.active { outline: 2px solid rgba(0,0,0,0.08); }
        .letter-box.filled { color: #000000; }
        /* Soft / "ghost" letters: already on the board, reuse-if-you-can. Dashed border + translucent fill (set inline per position color). */
        .letter-box.soft {
            border: 2px dashed rgba(0,0,0,0.5) !important;
            color: rgba(0,0,0,0.55);
            font-style: italic;
        }
        .letter-box.soft:hover { border-color: rgba(0,0,0,0.8) !important; }

        /* Filled color cycle (in order, then loop) */
        .fill-color-0 { background-color: #e9bba4; }
        .fill-color-1 { background-color: #e7b465; }
        .fill-color-2 { background-color: #f6e29b; }
        .fill-color-3 { background-color: #e4db4e; }
        .fill-color-4 { background-color: #b3be9e; }
        .fill-color-5 { background-color: #bec4dc; }
        .fill-color-6 { background-color: #ceb7cb; }

        .clear-btn {
            position: absolute;
            top: -6px; right: -6px;
            width: 16px; height: 16px;
            background: #eabb9f;
            color: #000;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
            cursor: pointer;
            border: 2px solid #000;
            line-height: 1;
        }
        .clear-btn:hover { background: #d79a86; }

        .keyboard-btn {
            border: 2px solid #d1d5db;
            border-radius: 0.4rem;
            background-color: #eff0ea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.5rem 0;
            aspect-ratio: 1;
            width: 100%;
            font-size: clamp(0.85rem, 2.6vw, 1.15rem);
        }
        .keyboard-btn:hover { border-color: #4f46e5; background-color: #e6e9df; }

        /* Larger form controls */
        #blockInput, #wordLength {
            font-size: 1.05rem;
            padding: 0.75rem 0.9rem;
            background-color: #eff0ea;
        }
        /* Add-block button: plus sign with angular corners, #189973 background and black border */
        #addBlock {
            background-color: #189973;
            border: 2px solid #000;
            border-radius: 0;
            color: #ffffff;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 120ms ease, transform 120ms ease;
            padding: 0;
        }
        #addBlock:hover { background-color: #147a60; transform: translateY(-1px); }

        /* Results pane background */
        #resultsContainer { background-color: #eff0ea; }

        .block-color-0 { background-color: #fde68a; }
        .block-color-1 { background-color: #bbf7d0; }
        .block-color-2 { background-color: #bfdbfe; }
        .block-color-3 { background-color: #fbcfe8; }
        .block-color-5 { background-color: #fecaca; }
        .block-color-6 { background-color: #fef3c7; }
        .block-color-7 { background-color: #d1fae5; }
        .block-color-8 { background-color: #e9d5ff; }
        .block-span { padding: 0 0.2rem; border-radius: 0.3rem; display: inline-block; }
        .required-block { border: 2px solid #000; border-radius: 0; color: #000; padding: 0.55rem 0.55rem; font-size: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.12em; font-family: 'Banana Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }

        .clear-blocks-btn { background: #e6bda1; border: 2px solid #000; color: #000; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.15rem 0.25rem; width: 42px; overflow: hidden; white-space: nowrap; cursor: pointer; transition: width 180ms ease, background 120ms; font-size: 1.25rem; }
            .clear-blocks-btn { background: #e6bda1; border: 2px solid #000; color: #000; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.15rem 0.25rem; width: 42px; overflow: hidden; white-space: nowrap; cursor: pointer; transition: width 180ms ease, background 120ms, justify-content 120ms ease, padding-left 120ms ease; font-size: 1.25rem; }
            .clear-blocks-btn .label { display: none; margin-left: 6px; }
            .clear-blocks-btn:hover { width: 110px; justify-content: flex-start; padding-left: 8px; }
            .clear-blocks-btn:hover .label { display: inline-block; }

        /* Results should use Banana Grotesk */
        #resultsContainer, #resultsContainer * { font-family: 'Banana Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        .result-tile { text-transform: uppercase; letter-spacing: 0.18em; font-family: 'Banana Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color: #000; }
        /* Make UI angular and add black borders */
        .rounded-xl, .rounded-lg, .rounded, .rounded-md, .rounded-full { border-radius: 0 !important; }
        .inner-card { border: 2px solid #000 !important; }
        #resultsContainer, .result-tile, .required-block, .block-span, input, select, button, .keyboard-btn, .clear-blocks-btn { border: 2px solid #000 !important; border-radius: 0 !important; }
        /* keep the small clear X circular */
        .clear-btn { border-radius: 50% !important; }
        /* Partial block use: a single letter borrowed from a multi-letter block (leftover unused). Dashed + translucent vs. solid full-block use. */
        .block-span-partial { border: 1px dashed rgba(0,0,0,0.65) !important; font-style: italic; }
        /* Click a placed letter to cycle which letter of that block is borrowed */
        .borrow-cell { cursor: pointer; }
        .borrow-cell:hover { outline: 2px solid rgba(0,0,0,0.55); outline-offset: -2px; }

        /* Save button on result tiles */
        .save-word-btn {
            position: absolute;
            top: 3px; right: 4px;
            background: none;
            border: none !important;
            color: rgba(0,0,0,0.18);
            font-size: 0.78rem;
            cursor: pointer;
            line-height: 1;
            padding: 2px 3px;
            transition: color 100ms;
        }
        .save-word-btn:hover, .save-word-btn.saved { color: #c49a22; }

        /* Build-from button on result tiles: seed the board with this word as soft letters */
        .build-from-btn {
            position: absolute;
            top: 3px; right: 22px;
            background: none;
            border: none !important;
            color: rgba(0,0,0,0.18);
            font-size: 0.82rem;
            cursor: pointer;
            line-height: 1;
            padding: 2px 3px;
            transition: color 100ms;
        }
        .build-from-btn:hover, .build-from-btn.active-base { color: #189973; }

        /* Saved words panel */
        .saved-word-item {
            display: flex;
            align-items: stretch;
            border: 2px solid #000;
            background: #eff0ea;
        }
        .restore-saved-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0.35rem 0.6rem;
            background: none;
            border: none !important;
            border-right: 2px solid #000 !important;
            cursor: pointer;
            text-align: left;
            font-family: 'Banana Grotesk', system-ui, sans-serif;
            transition: background 100ms;
        }
        .restore-saved-btn:hover { background: #e9bba4; }
        .saved-word-text {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.1em;
        }
        .saved-word-meta {
            font-size: 0.62rem;
            color: #555;
            letter-spacing: 0.05em;
            margin-top: 2px;
            font-family: 'Banana Grotesk', system-ui, sans-serif;
        }
        .remove-saved-btn {
            width: 34px;
            flex-shrink: 0;
            background: none;
            border: none !important;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 100ms;
            color: #000;
        }
        .remove-saved-btn:hover { background: #e6bda1; }

        /* Remove word button on result tiles */
        .remove-word-btn {
            position: absolute;
            top: 3px; left: 4px;
            background: none;
            border: none !important;
            color: rgba(0,0,0,0.18);
            font-size: 0.75rem;
            cursor: pointer;
            line-height: 1;
            padding: 2px 3px;
            transition: color 100ms;
        }
        .remove-word-btn:hover { color: #c0392b; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen p-3 sm:p-6">
    <div class="max-w-6xl mx-auto">
        <div class="rounded-xl shadow-xl p-4 sm:p-8 inner-card" style="background-color: #eff0ea;">
            <h1 class="text-2xl sm:text-4xl font-bold text-blue-700 mb-1">Gubbins Word Search Tool</h1>
            <p class="text-sm text-gray-600 mb-1">Click boxes to enter letters, or filter by required letter blocks</p>
            <p class="text-xs text-gray-500 mb-5">Dictionary: <span id="wordCount">Loading...</span> words</p>

            <!-- Word Length Selector -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Number of Letters</label>
                <select id="wordLength" class="w-full sm:w-auto px-3 py-2 text-base border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none" style="background-color: #eff0ea;">
                    <option value="2">2 Letters</option>
                    <option value="3">3 Letters</option>
                    <option value="4">4 Letters</option>
                    <option value="5">5 Letters</option>
                    <option value="6">6 Letters</option>
                    <option value="7">7 Letters</option>
                    <option value="8">8 Letters</option>
                    <option value="9" selected>9 Letters</option>
                    <option value="10">10 Letters</option>
                    <option value="11">11 Letters</option>
                    <option value="12">12 Letters</option>
                    <option value="13">13 Letters</option>
                    <option value="14">14 Letters</option>
                    <option value="15">15 Letters</option>
                </select>
            </div>

            <!-- Letter Boxes -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Fill in the blanks</label>
                    <div class="flex gap-2">
                        <button id="lockBaseBtn" class="clear-blocks-btn" title="Lock all base letters" style="display:none;" onclick="lockAllSoft()"><span class="icon">🔒</span><span class="label">Lock Base</span></button>
                        <button id="clearBaseBtn" class="clear-blocks-btn" title="Clear base letters" style="display:none;" onclick="clearAllSoft()"><span class="icon">⌫</span><span class="label">Clear Base</span></button>
                        <button id="undoBtn" class="clear-blocks-btn" title="Undo last action" style="display:none;" onclick="undo()"><span class="icon">↩</span><span class="label">Undo</span></button>
                        <button id="clearAll" class="clear-blocks-btn" title="Clear all letters" style="display: none;"><span class="icon">×</span><span class="label">Clear All</span></button>
                    </div>
                </div>
                <div id="letterBoxes" class="mb-3"></div>

                <!-- on-screen keyboard removed; typing via physical keyboard is enabled -->
            </div>

            <!-- Required Letter Blocks -->
            <div class="mb-5 p-3" style="background-color: #eff0ea;">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Required Letter Blocks <span class="font-normal text-gray-400">(optional)</span></label>
                    <button id="clearBlocksAll" class="clear-blocks-btn" title="Clear all blocks"><span class="icon">×</span><span class="label">Clear All</span></button>
                </div>
                <div class="flex gap-2 mb-3 w-full">
                    <input type="text" id="blockInput" placeholder='e.g. ail, v, able'
                           class="flex-1 min-w-0 px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-sm">
                    <button id="addBlock" class="shrink-0" aria-label="Add block">+</button>
                </div>
                <div id="blocksList" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Position Analysis (auto-shown when blocks are set) -->
            <div id="posAnalysisSection" class="mb-5 p-3" style="display: none; background-color: #eff0ea;">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Position Analysis</label>
                    <button id="posAnalysisToggle" type="button" onclick="togglePositionAnalysis()" title="Collapse" style="background:none;border:2px solid #000!important;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;font-weight:700;line-height:1;padding:0;font-family:'Banana Grotesk',sans-serif;">−</button>
                </div>
                <div id="posAnalysisResults"></div>
            </div>

            <!-- Saved Words Panel -->
            <div id="savedWordsSection" class="mb-5" style="display: none;">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Saved Words <span id="savedWordsBadge" class="text-gray-400 font-normal text-xs"></span></label>
                    <div class="flex gap-2">
                        <button id="savedWordsToggle" type="button" onclick="toggleSavedWords()" title="Collapse" style="background:none;border:2px solid #000!important;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;font-weight:700;line-height:1;padding:0;font-family:'Banana Grotesk',sans-serif;">−</button>
                        <button id="clearSavedAll" class="clear-blocks-btn" title="Clear all saved words"><span class="icon">×</span><span class="label">Clear All</span></button>
                    </div>
                </div>
                <div id="savedWordsList" class="grid grid-cols-1 sm:grid-cols-2 gap-1"></div>
            </div>

            <!-- Results -->
            <div class="mt-6">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800">
                        Results
                        <span class="text-base font-normal text-gray-500 ml-1">(<span id="resultCount">0</span> <span id="resultWord">words</span>)</span>
                    </h2>
                    <div class="flex items-center gap-3 flex-wrap">
                        <span id="hiddenWordsNotice" style="display:none; font-family:'Banana Grotesk',sans-serif; font-size:0.75rem; color:#888;">
                            <button type="button" onclick="toggleHiddenWordsList()" style="background:none;border:none!important;color:#888;cursor:pointer;font-size:0.75rem;padding:0;font-family:'Banana Grotesk',sans-serif;"><span id="hiddenWordsCount">0</span> hidden ▾</button>
                        </span>
                        <label id="softFilterWrap" class="text-sm text-gray-600 flex items-center gap-2" style="display:none;">
                            <input type="checkbox" id="softFilterMode" />
                            <span class="text-sm">Only show words matching the base</span>
                        </label>
                        <label class="text-sm text-gray-600 flex items-center gap-2">
                            <input type="checkbox" id="filterByBlocks" />
                            <span class="text-sm">Only show words with required blocks</span>
                        </label>
                    </div>
                </div>
                <div id="hiddenWordsList" style="display:none; flex-wrap:wrap; gap:4px; margin-bottom:8px; padding:6px; background:#eff0ea; border:2px solid #000;"></div>
                <div id="resultsContainer" class="text-center py-10 bg-gray-50 rounded-lg border-2 border-gray-200">
                    <p class="text-gray-400 text-sm">Click boxes above to start searching</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let wordList = [];
        const wordBuckets = Object.create(null); // length -> [words]
        let letterBoxes = [];
        let softLetters = [];        // parallel to letterBoxes: 'ghost' letters already on the board (reuse-if-you-can)
        let softFilterMode = false;  // false = soft letters only rank results; true = soft letters filter results
        let placementOverrides = {}; // word -> { blockIndex: {start,length} }: manual "use this letter" choices
        let _overrideSig = null;     // invalidates overrides when the pattern/blocks/length change
        let _lastRenderedResults = [];
        let requiredBlocks = [];
        let filterByBlocks = false;
        const BLOCK_PALETTE = ['#e9bba4','#e7b465','#f6e29b','#e4db4e','#b3be9e','#bec4dc','#ceb7cb'];
        let _blockIdCounter = 0;
        let activeBox = null;
        let wordLength = 9;
        const WORD_CACHE_VERSION = 1;
        const WORD_CACHE_DB = 'gubbins-word-cache';
        const WORD_CACHE_STORE = 'kv';
        const WORD_CACHE_KEY = 'word-buckets-v1';
        const MAX_VISIBLE_RESULTS = 300;
        let wordlistScriptPromise = null;
        let savedWords = [];
        const SAVED_WORDS_KEY = 'gubbins-saved-words';
        let removedWords = new Set();
        const REMOVED_WORDS_KEY = 'gubbins-removed-words';
        const pendingRemovals = new Set();
        let bestPositionCombo = null; // [{blockIndex, start(0-indexed)}] from latest analysis
        let savedWordsExpanded = true;
        let _undoState = null;

        function clearBuckets() {
            for (const k in wordBuckets) delete wordBuckets[k];
        }

        function buildBucketsFromWords(words) {
            const buckets = Object.create(null);
            for (let i = 0; i < words.length; i++) {
                const w = words[i].toLowerCase();
                const l = w.length;
                if (!buckets[l]) buckets[l] = [];
                buckets[l].push(w);
            }
            return buckets;
        }

        function computeWordListSignature(words) {
            const list = words || [];
            let hash = 2166136261 >>> 0;
            const step = Math.max(1, Math.floor(list.length / 2048));
            for (let i = 0; i < list.length; i += step) {
                const w = (list[i] || '').toLowerCase();
                hash ^= w.length;
                hash = Math.imul(hash, 16777619) >>> 0;
                const maxChars = Math.min(6, w.length);
                for (let c = 0; c < maxChars; c++) {
                    hash ^= w.charCodeAt(c);
                    hash = Math.imul(hash, 16777619) >>> 0;
                }
            }
            hash ^= list.length;
            hash = Math.imul(hash, 16777619) >>> 0;
            return hash.toString(16).padStart(8, '0');
        }

        function applyBuckets(buckets, totalWords) {
            clearBuckets();
            for (const k in buckets) wordBuckets[k] = buckets[k];
            wordList = [];
            wordList.length = totalWords || 0;
            document.getElementById('wordCount').textContent = (totalWords || 0).toLocaleString();
            updateResults();
            schedulePositionAnalysis();
        }

        function openWordCacheDb() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) { resolve(null); return; }
                const req = indexedDB.open(WORD_CACHE_DB, 1);
                req.onupgradeneeded = function() {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(WORD_CACHE_STORE)) db.createObjectStore(WORD_CACHE_STORE);
                };
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(req.error); };
            });
        }

        async function getCachedWordData() {
            try {
                const db = await openWordCacheDb();
                if (!db) return null;
                const rec = await new Promise((resolve, reject) => {
                    const tx = db.transaction(WORD_CACHE_STORE, 'readonly');
                    const store = tx.objectStore(WORD_CACHE_STORE);
                    const req = store.get(WORD_CACHE_KEY);
                    req.onsuccess = function() { resolve(req.result || null); };
                    req.onerror = function() { reject(req.error); };
                });
                db.close();
                if (!rec) return null;
                if (rec.version !== WORD_CACHE_VERSION) return null;
                if (!rec.buckets || typeof rec.totalWords !== 'number') return null;
                return rec;
            } catch (_) {
                return null;
            }
        }

        async function setCachedWordData(buckets, totalWords, signature) {
            try {
                const db = await openWordCacheDb();
                if (!db) return;
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(WORD_CACHE_STORE, 'readwrite');
                    const store = tx.objectStore(WORD_CACHE_STORE);
                    store.put({ version: WORD_CACHE_VERSION, totalWords, buckets, signature: signature || null }, WORD_CACHE_KEY);
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function() { reject(tx.error); };
                });
                db.close();
            } catch (_) {
                // ignore cache write errors (quota/private mode/etc)
            }
        }

        function loadWordlistScript() {
            if (typeof WORD_LIST !== 'undefined') return Promise.resolve();
            if (wordlistScriptPromise) return wordlistScriptPromise;
            wordlistScriptPromise = new Promise((resolve, reject) => {
                const existing = document.querySelector('script[src="wordlist.js"]');
                if (existing) {
                    existing.addEventListener('load', () => resolve(), { once: true });
                    existing.addEventListener('error', (e) => reject(e), { once: true });
                    return;
                }
                const s = document.createElement('script');
                s.src = 'wordlist.js';
                s.defer = true;
                s.onload = resolve;
                s.onerror = reject;
                document.body.appendChild(s);
            });
            return wordlistScriptPromise;
        }

        async function refreshWordDataInBackground(cachedSignature) {
            try {
                await loadWordlistScript();
                if (typeof WORD_LIST === 'undefined') return;
                const nextSignature = computeWordListSignature(WORD_LIST);
                if (cachedSignature && nextSignature === cachedSignature) return;
                // Wordlist changed — clear any word removals so nothing is lost
                if (removedWords.size > 0) { removedWords = new Set(); persistRemovedWords(); updateHiddenWordsNotice(); }
                const nextBuckets = buildBucketsFromWords(WORD_LIST);
                applyBuckets(nextBuckets, WORD_LIST.length);
                setCachedWordData(nextBuckets, WORD_LIST.length, nextSignature);
            } catch (e) {
                console.warn('Background wordlist refresh failed:', e);
            }
        }

        async function initWordData() {
            const cached = await getCachedWordData();
            if (cached) {
                applyBuckets(cached.buckets, cached.totalWords);
                refreshWordDataInBackground(cached.signature || null);
                return;
            }

            try {
                await loadWordlistScript();
                if (typeof WORD_LIST === 'undefined') throw new Error('WORD_LIST is undefined');
                const buckets = buildBucketsFromWords(WORD_LIST);
                const signature = computeWordListSignature(WORD_LIST);
                applyBuckets(buckets, WORD_LIST.length);
                setCachedWordData(buckets, WORD_LIST.length, signature);
            } catch (e) {
                console.error('Failed to initialize word data:', e);
            }
        }

        // Fast pattern matcher without RegExp allocation
        function matchesPattern(word, boxes) {
            if (word.length !== boxes.length) return false;
            for (let i = 0; i < boxes.length; i++) {
                const b = boxes[i];
                if (!b) continue;
                if (word[i] !== b.toLowerCase()) return false;
            }
            return true;
        }

        function buildFilledPrefix(letterBoxesLocal) {
            const prefix = new Array(letterBoxesLocal.length + 1).fill(0);
            for (let i = 0; i < letterBoxesLocal.length; i++) {
                prefix[i + 1] = prefix[i] + (letterBoxesLocal[i] && letterBoxesLocal[i] !== '' ? 1 : 0);
            }
            return prefix;
        }

        function hasFilledInRange(prefix, start, length) {
            return (prefix[start + length] - prefix[start]) > 0;
        }

        // Block-placement matcher (moved out so it can be reused or run in a worker).
        // A block may be used FULLY (its whole sequence, contiguous) or PARTIALLY (one of its
        // letters, the rest left over). Full uses are chosen first and always preferred; remaining
        // blocks then lend a single letter into still-free positions via bipartite matching.
        // Returns { placements:[{blockIndex,start,length,partial,leftover?}], count, fullCount, totalLength }.
        // `forced` (optional): { blockIndex: {start,length} } — manual "use this letter here" choices
        // that are pre-placed; the remaining blocks are then optimized around them.
        function matchBlocksForWord(word, blocks, filledPrefix, forced) {
            if (!blocks || blocks.length === 0) return { placements: [], count: 0, fullCount: 0, totalLength: 0 };
            const n = blocks.length;

            function leftoverOf(bi, start, length) {
                if (length === blocks[bi].length) return '';
                const ch = word[start];
                const at = blocks[bi].indexOf(ch);
                return at >= 0 ? blocks[bi].slice(0, at) + blocks[bi].slice(at + 1) : blocks[bi];
            }

            const occupied = new Array(word.length).fill(false);
            for (let i = 0; i < word.length; i++) if (hasFilledInRange(filledPrefix, i, 1)) occupied[i] = true;

            // --- 0) Pre-place any forced (user-chosen) placements ---
            const placements = [];
            const isForced = new Array(n).fill(false);
            if (forced) {
                for (const key in forced) {
                    const bi = +key;
                    if (bi < 0 || bi >= n) continue;
                    const { start, length } = forced[key];
                    for (let i = start; i < start + length; i++) if (i >= 0 && i < word.length) occupied[i] = true;
                    placements.push({ blockIndex: bi, start, length, partial: length !== blocks[bi].length, leftover: leftoverOf(bi, start, length) });
                    isForced[bi] = true;
                }
            }

            // --- 1) Best set of non-overlapping FULL placements for the remaining blocks ---
            const fullPositions = blocks.map((block, bi) => {
                const starts = [];
                if (isForced[bi]) return starts;
                const bl = block.length;
                for (let i = 0; i <= word.length - bl; i++) {
                    let ok = true;
                    for (let j = 0; j < bl; j++) if (occupied[i + j]) { ok = false; break; }
                    if (ok && word.startsWith(block, i)) starts.push(i);
                }
                return starts;
            });
            const order = [];
            for (let i = 0; i < n; i++) if (!isForced[i]) order.push(i);
            order.sort((a, b) => {
                const la = blocks[a].length, lb = blocks[b].length;
                if (lb !== la) return lb - la;
                return fullPositions[a].length - fullPositions[b].length;
            });
            let bestFull = { placements: [], count: 0, totalLength: 0 };
            const used = [];
            function overlapsRange(s, e) {
                for (const u of used) { if (!(e < u.start || s > u.end)) return true; }
                return false;
            }
            function backtrack(idx, cur, curLen) {
                if (idx === order.length) {
                    if (cur.length > bestFull.count || (cur.length === bestFull.count && curLen > bestFull.totalLength))
                        bestFull = { placements: cur.slice(), count: cur.length, totalLength: curLen };
                    return;
                }
                const bi = order[idx];
                const bl = blocks[bi].length;
                for (const s of fullPositions[bi]) {
                    const e = s + bl - 1;
                    if (overlapsRange(s, e)) continue;
                    used.push({ start: s, end: e });
                    cur.push({ blockIndex: bi, start: s, length: bl, partial: false });
                    backtrack(idx + 1, cur, curLen + bl);
                    cur.pop(); used.pop();
                }
                backtrack(idx + 1, cur, curLen);
            }
            backtrack(0, [], 0);
            for (const p of bestFull.placements) placements.push(p);

            // --- 2) Lend a single letter from each not-yet-used block into a free position ---
            for (const p of placements) for (let i = p.start; i < p.start + p.length; i++) occupied[i] = true;
            const usedBlock = new Array(n).fill(false);
            for (const p of placements) usedBlock[p.blockIndex] = true;
            const freePos = [];
            for (let i = 0; i < word.length; i++) if (!occupied[i]) freePos.push(i);

            if (freePos.length) {
                const blockLetterSet = blocks.map(b => new Set(b.split('')));
                const posOwner = new Map(); // free position -> blockIndex it currently lends to
                function tryAssign(bi, seen) {
                    for (const pos of freePos) {
                        if (seen.has(pos) || !blockLetterSet[bi].has(word[pos])) continue;
                        seen.add(pos);
                        if (!posOwner.has(pos) || tryAssign(posOwner.get(pos), seen)) {
                            posOwner.set(pos, bi);
                            return true;
                        }
                    }
                    return false;
                }
                for (let bi = 0; bi < n; bi++) {
                    if (!usedBlock[bi] && blocks[bi].length >= 2) tryAssign(bi, new Set());
                }
                for (const [pos, bi] of posOwner.entries()) {
                    placements.push({ blockIndex: bi, start: pos, length: 1, partial: true, leftover: leftoverOf(bi, pos, 1) });
                }
            }

            let totalLength = 0, fullCount = 0;
            for (const p of placements) { totalLength += p.length; if (!p.partial) fullCount++; }
            return { placements, count: placements.length, fullCount, totalLength };
        }

        // All candidate placements (full + single-letter) for one block in a word, given which
        // positions are already taken by filled boxes and the OTHER blocks' current placements.
        function candidatePlacementsForBlock(word, blocks, bi, occupied) {
            const block = blocks[bi], bl = block.length, cands = [];
            for (let i = 0; i <= word.length - bl; i++) {        // full
                let ok = true;
                for (let j = 0; j < bl; j++) if (occupied[i + j]) { ok = false; break; }
                if (ok && word.startsWith(block, i)) cands.push({ start: i, length: bl });
            }
            if (bl >= 2) {                                        // single letters
                for (let i = 0; i < word.length; i++) {
                    if (!occupied[i] && block.indexOf(word[i]) !== -1) cands.push({ start: i, length: 1 });
                }
            }
            cands.sort((a, b) => a.start - b.start || b.length - a.length);
            return cands;
        }

        // Click a placed letter on a result tile to cycle which letter of that block is used.
        function cycleBlockBorrow(word, blockIndex) {
            const blockTexts = requiredBlocks.map(b => b.text);
            if (blockIndex < 0 || blockIndex >= blockTexts.length) return;
            const filledPrefix = buildFilledPrefix(letterBoxes);
            const cur = matchBlocksForWord(word, blockTexts, filledPrefix, placementOverrides[word] || null);
            const occupied = new Array(word.length).fill(false);
            for (let i = 0; i < word.length; i++) if (hasFilledInRange(filledPrefix, i, 1)) occupied[i] = true;
            let curPlacement = null;
            for (const p of cur.placements) {
                if (p.blockIndex === blockIndex) { curPlacement = p; continue; }
                for (let i = p.start; i < p.start + p.length; i++) occupied[i] = true;
            }
            const cands = candidatePlacementsForBlock(word, blockTexts, blockIndex, occupied);
            if (cands.length <= 1) return;
            let curIdx = curPlacement ? cands.findIndex(c => c.start === curPlacement.start && c.length === curPlacement.length) : -1;
            const next = cands[(curIdx + 1) % cands.length];
            if (!placementOverrides[word]) placementOverrides[word] = {};
            placementOverrides[word][blockIndex] = { start: next.start, length: next.length };
            renderResultsFromMeta(_lastRenderedResults, { skipSort: true });
        }

        // Debounce helper to avoid heavy recalculation on rapid input
        function debounce(fn, wait) {
            let t = null;
            return function(...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        const scheduleUpdateResults = debounce(updateResults, 40);
        function updateResultsImmediate() { updateResults(); }

        // Web Worker for block-placement matching (if available)
        let blockWorker = null;
        let latestJobId = 0;
        if (window.Worker) {
            try {
                blockWorker = new Worker('blockWorker.js');
                // accumulate worker chunks and render once when the job is complete
                const workerResultsAccum = Object.create(null);
                blockWorker.onmessage = function(e) {
                    const { jobId, partial, results, done } = e.data;
                    if (jobId !== latestJobId) return; // stale
                    if (partial) {
                        if (!workerResultsAccum[jobId]) workerResultsAccum[jobId] = [];
                        if (partial.length) workerResultsAccum[jobId].push(...partial);
                        if (done) {
                            const finalResults = workerResultsAccum[jobId] || [];
                            delete workerResultsAccum[jobId];
                            renderResultsFromMeta(finalResults);
                        }
                        return;
                    }
                    if (results) {
                        renderResultsFromMeta(results);
                    }
                };
            } catch (err) {
                blockWorker = null;
                console.warn('Worker creation failed, falling back to main-thread matching', err);
            }
        }

        function matchesBestCombo(placements) {
            if (!bestPositionCombo || !bestPositionCombo.length) return false;
            return bestPositionCombo.every(bp =>
                placements.some(p => p.blockIndex === bp.blockIndex && p.start === bp.start)
            );
        }

        // Render helper reused by both sync and worker paths
        function renderResultsFromMeta(resultsWithMeta, options = {}) {
            if (!options.skipSort) {
                resultsWithMeta.sort((a, b) => {
                    // Words matching the soft "base" float to the very top, then by how many base letters they hit.
                    const aFull = a.softFull ? 1 : 0, bFull = b.softFull ? 1 : 0;
                    if (bFull !== aFull) return bFull - aFull;
                    const aScore = a.softScore || 0, bScore = b.softScore || 0;
                    if (bScore !== aScore) return bScore - aScore;
                    const aTop = matchesBestCombo(a.match.placements) ? 1 : 0;
                    const bTop = matchesBestCombo(b.match.placements) ? 1 : 0;
                    if (bTop !== aTop) return bTop - aTop;
                    if (b.match.count !== a.match.count) return b.match.count - a.match.count;
                    const aBlkFull = a.match.fullCount || 0, bBlkFull = b.match.fullCount || 0;
                    if (bBlkFull !== aBlkFull) return bBlkFull - aBlkFull;
                    if (b.match.totalLength !== a.match.totalLength) return b.match.totalLength - a.match.totalLength;
                    return a.word.localeCompare(b.word);
                });
            }

            // Invalidate manual borrow choices if the pattern/blocks/length changed.
            const ovSig = JSON.stringify([wordLength, letterBoxes, requiredBlocks.map(b => b.text)]);
            if (ovSig !== _overrideSig) { placementOverrides = {}; _overrideSig = ovSig; }
            _lastRenderedResults = resultsWithMeta;
            const blockTextsForOv = requiredBlocks.map(b => b.text);
            const filledPrefixForOv = buildFilledPrefix(letterBoxes);

            const container = document.getElementById('resultsContainer');
            const totalResults = resultsWithMeta.length;
            document.getElementById('resultCount').textContent = totalResults;
            document.getElementById('resultWord').textContent = totalResults === 1 ? 'word' : 'words';

            if (totalResults > 0) {
                const visibleResults = resultsWithMeta.slice(0, MAX_VISIBLE_RESULTS);
                const truncated = totalResults > MAX_VISIBLE_RESULTS;
                container.className = 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 max-h-96 overflow-y-auto p-3 bg-gray-50 rounded-lg border-2 border-gray-200';
                const palette = ['#e9bba4','#e7b465','#f6e29b','#e4db4e','#b3be9e','#bec4dc','#ceb7cb'];
                let gridHtml = visibleResults.map(item => {
                    const w = item.word;
                        // Apply any manual borrow choices for this word.
                        const effMatch = placementOverrides[w]
                            ? matchBlocksForWord(w, blockTextsForOv, filledPrefixForOv, placementOverrides[w])
                            : item.match;
                        const cellMap = Array(w.length).fill(null);
                        for (const p of effMatch.placements) {
                            const bi = p.blockIndex;
                            const col = (requiredBlocks[bi] && requiredBlocks[bi].color) || BLOCK_PALETTE[bi % BLOCK_PALETTE.length];
                            for (let i = p.start; i < p.start + p.length; i++) cellMap[i] = { col, partial: !!p.partial, leftover: p.leftover, bi };
                        }
                    let html = '';
                        for (let i = 0; i < w.length; i++) {
                            const cell = cellMap[i];
                            if (cell === null) {
                                html += `<span>${w[i]}</span>`;
                            } else if (cell.partial) {
                                const bg = hexToRgba(cell.col, 0.4);
                                const title = cell.leftover ? `${requiredBlocks[cell.bi] ? requiredBlocks[cell.bi].text.toUpperCase() + ' — ' : ''}leftover ${cell.leftover.toUpperCase()} · click to use a different letter` : 'partial block use';
                                html += `<span class="block-span block-span-partial borrow-cell" style="background-color: ${bg};" title="${title}" onclick="cycleBlockBorrow('${w}', ${cell.bi})">${w[i]}</span>`;
                            } else {
                                const dark = darkenHex(cell.col, 16);
                                html += `<span class="block-span borrow-cell" style="background-color: ${dark};" title="click to use a different letter of this block" onclick="cycleBlockBorrow('${w}', ${cell.bi})">${w[i]}</span>`;
                            }
                        }
                        const color = palette[Math.floor(Math.random() * palette.length)];
                        const alreadySaved = savedWords.some(s => s.word === w);
                        return `<div class="px-2 py-2 border-2 border-gray-200 rounded-lg text-center font-medium hover:border-indigo-400 hover:shadow-md transition text-sm sm:text-base result-tile" style="background-color: ${color}; position: relative;"><button type="button" class="remove-word-btn" onclick="removeWordFromCache('${w}')" title="Remove this word">×</button><button type="button" class="save-word-btn${alreadySaved ? ' saved' : ''}" data-word="${w}" onclick="saveCurrentWord('${w}')" title="Play this word: save it, use up its tiles, carry leftovers to the next word">★</button>${html}</div>`;
                }).join('');
                if (truncated) {
                    gridHtml += `<div class="col-span-2 sm:col-span-3 lg:col-span-4 text-xs text-gray-500 text-center py-1">Showing first ${MAX_VISIBLE_RESULTS.toLocaleString()} of ${totalResults.toLocaleString()} matches</div>`;
                }
                container.innerHTML = gridHtml;
            } else {
                container.className = 'text-center py-10 bg-gray-50 rounded-lg border-2 border-gray-200';
                const hasInput = letterBoxes.some(b => b !== '') || requiredBlocks.length > 0;
                container.innerHTML = `<p class="text-gray-400 text-sm">${hasInput ? 'No words found matching your pattern' : 'Click boxes above to start searching'}</p>`;
            }
            updateHiddenWordsNotice();
            updateSoftControls();
        }

        function setBoxGridColumns() {
            document.getElementById('letterBoxes').style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
        }

        function initializeBoxes() {
            const container = document.getElementById('letterBoxes');
            container.innerHTML = '';
            letterBoxes = Array(wordLength).fill('');
            softLetters = Array(wordLength).fill('');
            setBoxGridColumns();
            for (let i = 0; i < wordLength; i++) {
                const wrap = document.createElement('div');
                wrap.className = 'relative';
                wrap.style.minWidth = '0';
                wrap.innerHTML = `<button class="letter-box" data-index="${i}"></button>`;
                container.appendChild(wrap);
            }
            document.querySelectorAll('.letter-box').forEach((box, i) => {
                box.addEventListener('click', () => handleBoxClick(i));
            });
            activeBox = null;
            updateBoxDisplay();
            updateBoxStyles();
            updateKeyboard();
            updateSoftControls();
        }

        function updateResults() {
            const raw = wordBuckets[wordLength] || [];
            const candidates = removedWords.size > 0 ? raw.filter(w => !removedWords.has(w)) : raw;
            const blockTexts = requiredBlocks.map(b => b.text);
            const filledPrefix = buildFilledPrefix(letterBoxes);
            const soft = softLetters.map(s => (s || '').toLowerCase());
            const softTotal = soft.reduce((n, s) => n + (s ? 1 : 0), 0);

            if (candidates.length === 0) {
                renderResultsFromMeta([]);
                return;
            }

            // Use worker when available so typing stays responsive.
            if (blockWorker) {
                latestJobId += 1;
                const jobId = latestJobId;
                blockWorker.postMessage({
                    jobId,
                    candidates,
                    letterBoxes: letterBoxes.slice(),
                    blocks: blockTexts,
                    filterByBlocks: !!filterByBlocks,
                    soft,
                    softTotal,
                    softFilter: !!softFilterMode
                });
                return; // results will be rendered when worker posts back
            }

            // Fallback: synchronous matching on main thread
            const resultsWithMeta = [];
            for (let i = 0; i < candidates.length; i++) {
                const w = candidates[i];
                if (!matchesPattern(w, letterBoxes)) continue;
                let softScore = 0;
                for (let k = 0; k < soft.length; k++) { if (soft[k] && w[k] === soft[k]) softScore++; }
                if (softFilterMode && softTotal > 0 && softScore !== softTotal) continue;
                const match = blockTexts.length
                    ? matchBlocksForWord(w, blockTexts, filledPrefix)
                    : { placements: [], count: 0, fullCount: 0, totalLength: 0 };
                if (filterByBlocks && match.count === 0) continue;
                resultsWithMeta.push({ word: w, match, softScore, softFull: softTotal > 0 && softScore === softTotal });
            }
            renderResultsFromMeta(resultsWithMeta, { skipSort: requiredBlocks.length === 0 && softTotal === 0 });
        }

        // on-screen keyboard removed; physical keyboard typing is supported

        function darkenHex(hex, percent) {
            hex = (hex || '').replace('#','');
            if (hex.length !== 6) return hex;
            const num = parseInt(hex,16);
            let r = (num >> 16) & 0xff;
            let g = (num >> 8) & 0xff;
            let b = num & 0xff;
            r = Math.max(0, Math.min(255, Math.round(r * (100 - percent) / 100)));
            g = Math.max(0, Math.min(255, Math.round(g * (100 - percent) / 100)));
            b = Math.max(0, Math.min(255, Math.round(b * (100 - percent) / 100)));
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function hexToRgba(hex, alpha) {
            hex = (hex || '').replace('#','');
            if (hex.length !== 6) return hex;
            const num = parseInt(hex, 16);
            const r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function handleBoxClick(index) {
            // Clicking a soft (ghost) box promotes it to a locked/hard letter.
            if (!letterBoxes[index] && softLetters[index]) {
                promoteSoftToHard(index);
                return;
            }
            activeBox = activeBox === index ? null : index;
            updateBoxStyles();
            updateKeyboard();
            // Focus the hidden input so mobile devices open the soft keyboard
            const hid = document.getElementById('hiddenInput');
            if (hid) hid.focus({ preventScroll: true });
        }

        function handleLetterInput(letter) {
            if (activeBox !== null) {
                saveUndoState();
                letterBoxes[activeBox] = letter;
                softLetters[activeBox] = ''; // typing a hard letter overrides any ghost there
                updateBoxDisplay();
                const nextEmpty = letterBoxes.findIndex((b, i) => i > activeBox && b === '');
                activeBox = nextEmpty !== -1 ? nextEmpty : null;
                updateBoxStyles();
                updateKeyboard();
                scheduleUpdateResults();
                updateClearButton();
                updateSoftControls();
                schedulePositionAnalysis();
            }
        }

        function clearBox(index) {
            saveUndoState();
            letterBoxes[index] = '';
            updateBoxDisplay();
            scheduleUpdateResults();
            updateClearButton();
            schedulePositionAnalysis();
        }

        function clearAllBoxes() {
            saveUndoState();
            letterBoxes = Array(wordLength).fill('');
            softLetters = Array(wordLength).fill('');
            activeBox = null;
            updateBoxDisplay();
            updateBoxStyles();
            updateKeyboard();
            scheduleUpdateResults();
            updateClearButton();
            updateSoftControls();
            schedulePositionAnalysis();
        }

        // ---- Soft / "base" (ghost) letters --------------------------------

        function promoteSoftToHard(index) {
            if (!softLetters[index]) return;
            saveUndoState();
            letterBoxes[index] = softLetters[index];
            softLetters[index] = '';
            updateBoxDisplay();
            updateClearButton();
            updateSoftControls();
            scheduleUpdateResults();
            schedulePositionAnalysis();
        }

        function clearSoftBox(index) {
            if (!softLetters[index]) return;
            saveUndoState();
            softLetters[index] = '';
            updateBoxDisplay();
            updateSoftControls();
            scheduleUpdateResults();
            schedulePositionAnalysis();
        }

        function lockAllSoft() {
            if (!softLetters.some(s => s)) return;
            saveUndoState();
            for (let i = 0; i < softLetters.length; i++) {
                if (softLetters[i] && !letterBoxes[i]) { letterBoxes[i] = softLetters[i]; softLetters[i] = ''; }
            }
            updateBoxDisplay();
            updateClearButton();
            updateSoftControls();
            scheduleUpdateResults();
            schedulePositionAnalysis();
        }

        function clearAllSoft() {
            if (!softLetters.some(s => s)) return;
            saveUndoState();
            softLetters = Array(wordLength).fill('');
            updateBoxDisplay();
            updateSoftControls();
            scheduleUpdateResults();
            schedulePositionAnalysis();
        }

        // Seed the board with a result word as soft letters (replaces any existing base).
        function buildFromWord(word) {
            saveUndoState();
            softLetters = Array(wordLength).fill('');
            for (let i = 0; i < word.length && i < wordLength; i++) {
                if (!letterBoxes[i]) softLetters[i] = word[i].toUpperCase();
            }
            updateBoxDisplay();
            updateBoxStyles();
            updateSoftControls();
            scheduleUpdateResults();
            schedulePositionAnalysis();
        }

        function updateSoftControls() {
            const hasSoft = softLetters.some(s => s);
            const lockBtn = document.getElementById('lockBaseBtn');
            const clearBtn = document.getElementById('clearBaseBtn');
            const wrap = document.getElementById('softFilterWrap');
            if (lockBtn) lockBtn.style.display = hasSoft ? 'inline-flex' : 'none';
            if (clearBtn) clearBtn.style.display = hasSoft ? 'inline-flex' : 'none';
            if (wrap) wrap.style.display = hasSoft ? 'flex' : 'none';
            // Mark which result tile is the active base
            const base = hasSoft ? softLetters.map((s, i) => (letterBoxes[i] || s || '').toLowerCase()).join('') : '';
            document.querySelectorAll('.build-from-btn').forEach(btn => {
                btn.classList.toggle('active-base', hasSoft && btn.dataset.word === base);
            });
        }

        function updateBoxDisplay() {
            document.querySelectorAll('.letter-box').forEach((box, index) => {
                const parent = box.parentElement;
                const letter = letterBoxes[index];
                const soft = !letter ? softLetters[index] : '';
                box.style.backgroundColor = '';
                if (letter) {
                    box.textContent = letter;
                    const colorIndex = index % 7;
                    box.className = `letter-box filled fill-color-${colorIndex}`;
                } else if (soft) {
                    box.textContent = soft;
                    box.className = 'letter-box soft';
                    // translucent version of the position's fill color
                    box.style.backgroundColor = hexToRgba(FILL_COLORS[index % 7], 0.35);
                } else {
                    box.textContent = '';
                    box.className = 'letter-box';
                }
                const existing = parent.querySelector('.clear-btn');
                if (existing) existing.remove();
                if (letter || soft) {
                    const btn = document.createElement('button');
                    btn.className = 'clear-btn';
                    btn.innerHTML = '×';
                    btn.addEventListener('click', (e) => { e.stopPropagation(); letter ? clearBox(index) : clearSoftBox(index); });
                    parent.appendChild(btn);
                }
            });
        }

        function updateBoxStyles() {
            document.querySelectorAll('.letter-box').forEach((box, i) => {
                box.classList.toggle('active', i === activeBox);
            });
        }

        function updateKeyboard() {
            // no visual on-screen keyboard; keep active position text updated if present
            const pos = document.getElementById('activePosition');
            if (pos) pos.textContent = activeBox !== null ? (activeBox + 1) : '';
        }

        function updateClearButton() {
            const btn = document.getElementById('clearAll');
            if (btn) btn.style.display = letterBoxes.some(b => b !== '') ? 'inline-flex' : 'none';
        }

        function saveUndoState() {
            _undoState = {
                letterBoxes: letterBoxes.slice(),
                softLetters: softLetters.slice(),
                requiredBlocks: requiredBlocks.map(b => ({...b}))
            };
            updateUndoButton();
        }

        function updateUndoButton() {
            const btn = document.getElementById('undoBtn');
            if (btn) btn.style.display = _undoState ? 'inline-flex' : 'none';
        }

        function persistSavedWords() {}

        function saveCurrentWord(word) {
            const blockTexts = requiredBlocks.map(b => b.text);
            const filledPrefix = buildFilledPrefix(letterBoxes);
            const match = matchBlocksForWord(word, blockTexts, filledPrefix, placementOverrides[word] || null);
            const entry = { word, wordLength, letterBoxes: letterBoxes.slice(), blocks: requiredBlocks.map(b => ({...b})), placements: match.placements };

            // One entry per word: if it's already saved, refresh that entry in place rather than
            // adding a duplicate (e.g. after re-choosing which letter a block borrows).
            const idx = savedWords.findIndex(s => s.word === word);
            if (idx !== -1) {
                const prev = savedWords[idx];
                const unchanged = JSON.stringify(prev.placements) === JSON.stringify(entry.placements) &&
                    JSON.stringify(prev.letterBoxes) === JSON.stringify(entry.letterBoxes) &&
                    JSON.stringify(prev.blocks.map(b => b.text)) === JSON.stringify(blockTexts);
                if (unchanged) return; // already saved exactly this — nothing to do
                entry.id = prev.id;
                savedWords[idx] = entry;
            } else {
                entry.id = 'sw' + Date.now().toString(36);
                savedWords.unshift(entry);
            }
            persistSavedWords();
            updateSavedWordsPanel();
            document.querySelectorAll(`.save-word-btn[data-word="${word}"]`).forEach(btn => btn.classList.add('saved'));
            // Saving = "I played this word": consume the tiles it used and carry any leftover
            // letters into the boxes as the seed for the next (adjacent) word.
            playWordTiles(match);
        }

        // Consume the tiles a played word used (removing them from Required Letter Blocks) and start
        // the next word: clear the boxes, then drop each leftover letter in as a full (hard) letter —
        // you already played the word, so the leftover is committed on the board.
        function playWordTiles(match) {
            saveUndoState();
            const placements = match.placements || [];
            const usedIdx = new Set(placements.map(p => p.blockIndex));
            requiredBlocks = requiredBlocks.filter((b, idx) => !usedIdx.has(idx));
            letterBoxes = Array(wordLength).fill('');
            softLetters = Array(wordLength).fill('');
            // Drop each leftover letter in the same column its borrowed letter occupied — that's the
            // crossing point you'll build the next word off. (Spill to the next free box if needed.)
            for (const p of placements) {
                if (!p.partial || !p.leftover) continue;
                let pos = p.start;
                for (const ch of p.leftover) {
                    while (pos < wordLength && letterBoxes[pos] !== '') pos++;
                    if (pos >= wordLength) break;
                    letterBoxes[pos] = ch.toUpperCase();
                    pos++;
                }
            }
            activeBox = null;
            updateBlocksList();
            updateBoxDisplay();
            updateBoxStyles();
            updateClearButton();
            updateSoftControls();
            scheduleUpdateResults();
            schedulePositionAnalysis();
        }

                    letterBoxes[i] = saved.word[i].toUpperCase();

        const FILL_COLORS = ['#e9bba4','#e7b465','#f6e29b','#e4db4e','#b3be9e','#bec4dc','#ceb7cb'];

        function renderSavedWordHtml(word, placements, blocks, savedLetterBoxes) {
            const colorMap = Array(word.length).fill(null);
            // Fill-color-cycle for manually typed letter box positions
            if (savedLetterBoxes) {
                for (let i = 0; i < Math.min(savedLetterBoxes.length, word.length); i++) {
                    if (savedLetterBoxes[i]) colorMap[i] = FILL_COLORS[i % 7];
                }
            }
            // Block placement colors override (higher priority)
            for (const p of (placements || [])) {
                const block = blocks[p.blockIndex];
                if (block) {
                    for (let i = p.start; i < p.start + p.length; i++) colorMap[i] = block.color;
                }
            }
            let html = '';
            for (let i = 0; i < word.length; i++) {
                const col = colorMap[i];
                html += col
                    ? `<span style="background-color:${darkenHex(col, 16)};padding:0 1px;">${word[i].toUpperCase()}</span>`
                    : `<span>${word[i].toUpperCase()}</span>`;
            }
            return html;
        }

        let _positionCombos = [];

        function applyPositionCombo(idx) {
            const combo = _positionCombos[idx];
            if (!combo) return;
            saveUndoState();
            for (const { start, text } of combo) {
                for (let j = 0; j < text.length; j++) {
                    if (start + j < letterBoxes.length) { letterBoxes[start + j] = text[j].toUpperCase(); softLetters[start + j] = ''; }
                }
            }
            const usedIds = new Set(combo.map(p => p.blockId).filter(Boolean));
            if (usedIds.size > 0) {
                requiredBlocks = requiredBlocks.filter(b => !usedIds.has(b.id));
                updateBlocksList();

            updateBoxDisplay();

            schedulePositionAnalysis();

        function applyBarPosition(blockId, positionIdx) {

        // Place a single borrowed letter (from a partial block use) at a position. The block stays in

        function applyLetterAt(letter, positionIdx) {

        // placements: [{start, length, color, text?}]
        function renderPositionPreview(wLen, placements) {
